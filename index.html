<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint Status</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }

        header {
            background: #800000;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .status-badge {
            background: #28a745;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
        }

        .status-badge.disconnected {
            background: #dc3545;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .panel {
            background: white;
            border-radius: 10px;
            padding: 30px 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .panel h2 {
            color: #800000;
            margin-bottom: 8px;
            text-align: center;
        }

        .panel .hint {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 22px;
        }

        #codeForm {
            display: flex;
            gap: 8px;
        }

        #codeInput {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            text-transform: uppercase;
        }

        #codeInput:focus {
            outline: 2px solid #800000;
            outline-offset: -1px;
        }

        #codeForm button {
            background: #800000;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0 20px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        #codeForm button:hover {
            background: #660000;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #999;
            font-size: 13px;
            margin: 20px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #ddd;
        }

        .divider span {
            padding: 0 12px;
        }

        .upload-btn {
            display: block;
            width: 100%;
            text-align: center;
            padding: 12px;
            border: 2px dashed #800000;
            border-radius: 6px;
            color: #800000;
            font-weight: bold;
            cursor: pointer;
            background: #fdf5f5;
        }

        .upload-btn:hover {
            background: #f6e9e9;
        }

        .lookup-message {
            margin-top: 16px;
            text-align: center;
            font-size: 13.5px;
            color: #555;
            min-height: 18px;
        }

        .lookup-message.error {
            color: #dc3545;
            font-weight: bold;
        }

        .back-btn {
            background: none;
            border: none;
            color: #800000;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 18px;
            padding: 0;
        }

        .back-btn:hover {
            text-decoration: underline;
        }

        #complaintList {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .complaint-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #eee;
            border-left: 5px solid #ccc;
            animation: slideIn 0.3s ease-out;
        }

        .severity-low {
            border-left-color: #28a745;
        }

        .severity-medium {
            border-left-color: #ffc107;
        }

        .severity-high {
            border-left-color: #dc3545;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
            color: #666;
        }

        .card-name {
            font-weight: bold;
            color: #333;
        }

        .card-body {
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .card-body p {
            margin-bottom: 4px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-top: 10px;
        }

        .score-tag {
            background: #eee;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .no-data {
            text-align: center;
            padding: 30px;
            color: #999;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <div>
                <h1>Complaint Status</h1>
            </div>
            <div id="status" class="status-badge disconnected">Connecting...</div>
        </header>

        <!-- Entry / lookup view -->
        <div id="lookupView" class="panel">
            <h2>Check Your Complaint Status</h2>
            <p class="hint">Enter the tracking code you received, or upload a photo of your QR code.</p>

            <form id="codeForm">
                <input type="text" id="codeInput" placeholder="e.g. ER-AB12CD34" autocomplete="off">
                <button type="submit">Check</button>
            </form>

            <div class="divider"><span>or</span></div>

            <label class="upload-btn" for="qrFileInput">📷 Upload a Photo of Your QR Code</label>
            <input type="file" id="qrFileInput" accept="image/*" hidden>

            <p id="lookupMessage" class="lookup-message"></p>
        </div>

        <!-- Result view -->
        <div id="resultView" class="panel" style="display:none;">
            <button id="backBtn" class="back-btn">‹ Check another complaint</button>
            <div id="complaintList"></div>
        </div>
    </div>

    <script>
        function esc(str) {
            return String(str ?? '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }

        const socket = io('https://rekserver-production.up.railway.app');

        const statusBadge = document.getElementById('status');
        const complaintList = document.getElementById('complaintList');
        const lookupView = document.getElementById('lookupView');
        const resultView = document.getElementById('resultView');
        const codeForm = document.getElementById('codeForm');
        const codeInput = document.getElementById('codeInput');
        const qrFileInput = document.getElementById('qrFileInput');
        const lookupMessage = document.getElementById('lookupMessage');
        const backBtn = document.getElementById('backBtn');

        // ---------- state ----------
        let latestHistory = [];   // cached copy of every complaint, refreshed whenever the server sends it
        let historyLoaded = false;
        let targetId = null;      // the tracking ID we're currently trying to show

        // ---------- connection ----------
        socket.on('connect', () => {
            statusBadge.innerText = "🟢 Connected (Live)";
            statusBadge.className = "status-badge";
        });

        socket.on('disconnect', () => {
            statusBadge.innerText = "🔴 Disconnected";
            statusBadge.className = "status-badge disconnected";
        });

        // ---------- view switching ----------
        function showResultView() {
            lookupView.style.display = 'none';
            resultView.style.display = 'block';
        }

        function showLookupView() {
            resultView.style.display = 'none';
            lookupView.style.display = 'block';
        }

        function setLookupMessage(text, isError) {
            lookupMessage.textContent = text;
            lookupMessage.className = 'lookup-message' + (isError ? ' error' : '');
        }

        function showRemovedMessage(text) {
            complaintList.innerHTML = `<div class="no-data">${esc(text)}</div>`;
        }

        // ---------- card rendering ----------
        function renderComplaintCard(data) {
            let severityClass = 'severity-low';
            if (data.score >= 25 && data.score < 40) {
                severityClass = 'severity-medium';
            } else if (data.score >= 40) {
                severityClass = 'severity-high';
            }

            const complaintId = data.trackingid || data.trackingId;

            const card = document.createElement('div');
            card.className = `complaint-card ${severityClass}`;
            card.id = complaintId;

            const statusIcon = data.status === 'Resolved' ? '🟢'
                : data.status === 'Rejected' ? '🔴'
                    : '🟡';

            card.innerHTML = `
        <div class="card-header">
            <span class="card-name">
                ${data.isAnonymous ? '🕵️ Anonymous Student' : '👤 ' + esc(data.name)} <span>${statusIcon}</span>
            </span>
            <span>📅 ${esc(data.date)}</span>
        </div>

        <div class="card-body">
            <p><strong>Tracking ID:</strong> ${esc(complaintId)}</p>
            <p><strong>Category:</strong> ${esc(data.category)}</p>
            <p class="status-line"><strong>Status:</strong> ${esc(data.status || 'Pending')}</p>
            <p>${data.text ? esc(data.text) : '<em>No written details provided.</em>'}</p>
        </div>

        <div class="card-footer">
            <span><strong>Section:</strong> ${esc(data.section || 'N/A')}</span>
            <span class="score-tag">Severity Score: ${data.score}</span>
        </div>
    `;

            complaintList.innerHTML = '';
            complaintList.appendChild(card);
        }

        // ---------- lookup flow ----------
        function normalizeCode(raw) {
            return raw.trim().toUpperCase();
        }

        function requestLookup(rawId) {
            const id = normalizeCode(rawId);
            if (!id) {
                setLookupMessage('Please enter a tracking code.', true);
                return;
            }
            targetId = id;
            codeInput.value = id;
            history.replaceState(null, '', '#' + id);

            if (historyLoaded) {
                resolveLookup();
            } else {
                setLookupMessage('Looking up your complaint…', false);
            }
        }

        function resolveLookup() {
            const match = latestHistory.find(c => (c.trackingid || c.trackingId) === targetId);
            if (match) {
                setLookupMessage('', false);
                renderComplaintCard(match);
                showResultView();
            } else {
                setLookupMessage('No complaint found with that tracking code. Double-check it and try again.', true);
            }
        }

        codeForm.addEventListener('submit', (e) => {
            e.preventDefault();
            requestLookup(codeInput.value);
        });

        backBtn.addEventListener('click', () => {
            targetId = null;
            history.replaceState(null, '', window.location.pathname);
            setLookupMessage('', false);
            showLookupView();
        });

        // ---------- QR photo upload ----------
        function decodeQRFromFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const code = jsQR(imageData.data, imageData.width, imageData.height);
                        if (code) {
                            resolve(code.data);
                        } else {
                            reject(new Error("Couldn't find a QR code in that photo. Try a clearer image."));
                        }
                    };
                    img.onerror = () => reject(new Error('That file could not be read as an image.'));
                    img.src = e.target.result;
                };
                reader.onerror = () => reject(new Error('That file could not be read.'));
                reader.readAsDataURL(file);
            });
        }

        function extractTrackingId(decodedText) {
            const hashIndex = decodedText.indexOf('#');
            return hashIndex !== -1 ? decodedText.slice(hashIndex + 1).trim() : decodedText.trim();
        }

        qrFileInput.addEventListener('change', async () => {
            const file = qrFileInput.files[0];
            if (!file) return;
            setLookupMessage('Reading QR code…', false);
            try {
                const decoded = await decodeQRFromFile(file);
                const id = extractTrackingId(decoded);
                requestLookup(id);
            } catch (err) {
                setLookupMessage(err.message, true);
            } finally {
                qrFileInput.value = '';
            }
        });

        // ---------- socket events ----------
        socket.on('complaintHistory', (historyArray) => {
            latestHistory = historyArray || [];
            historyLoaded = true;
            if (targetId) resolveLookup();
        });

        socket.on('newComplaint', (data) => {
            const id = data.trackingid || data.trackingId;
            latestHistory.push(data);
            if (targetId && id === targetId) {
                renderComplaintCard(data);
                showResultView();
            }
        });

        socket.on('statusUpdated', ({ trackingId, status }) => {
            if (trackingId !== targetId) return;
            const card = document.getElementById(trackingId);
            if (!card) return;
            const statusLine = card.querySelector('.status-line');
            if (statusLine) statusLine.innerHTML = `<strong>Status:</strong> ${esc(status)}`;
        });

        socket.on('cardDeleted', ({ trackingId }) => {
            if (trackingId !== targetId) return;
            showRemovedMessage('This complaint record has been removed.');
        });

        // ---------- entry point ----------
        if (window.location.hash) {
            requestLookup(window.location.hash.slice(1));
        }
    </script>
</body>

</html>
