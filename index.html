<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>complaint status</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }

        header {
            background: #800000;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            background: #28a745;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .status-badge.disconnected {
            background: #dc3545;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h2 {
            margin-bottom: 15px;
            color: #800000;
        }

        #complaintList {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .complaint-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border-left: 5px solid #ccc;
            animation: slideIn 0.3s ease-out;
        }

        /* Color coding by severity score */
        .severity-low {
            border-left-color: #28a745;
        }

        .severity-medium {
            border-left-color: #ffc107;
        }

        .severity-high {
            border-left-color: #dc3545;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
            color: #666;
        }

        .card-name {
            font-weight: bold;
            color: #333;
        }

        .card-body {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .score-tag {
            background: #eee;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
            background: white;
            border-radius: 8px;
        }

     
    </style>
</head>

<body>

    <div class="container">
        <header>
            <div>
                <h1>Complaint status</h1>
                <p>Real-time School Complaint Monitoring Feed</p>
            </div>
            <div id="status" class="status-badge disconnected">Connecting...</div>
        </header>

        <h2>Live Feed</h2>
        <div id="complaintList">
            <div class="no-data">No complaints received yet. Waiting for live activity...</div>
        </div>
    </div>

    <script>
        function esc(str) {
            return String(str ?? '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }

        // The tracking ID comes from the URL hash, e.g. #ER-AB12CD34
        const targetHash = window.location.hash; // includes the '#'
        const targetId = targetHash ? targetHash.slice(1) : null;

        const socket = io('https://rekserver-production.up.railway.app');

        const statusBadge = document.getElementById('status');
        const complaintList = document.getElementById('complaintList');

        socket.on('connect', () => {
            statusBadge.innerText = "🟢 Connected (Live)";
            statusBadge.className = "status-badge";
        });

        socket.on('disconnect', () => {
            statusBadge.innerText = "🔴 Disconnected";
            statusBadge.className = "status-badge disconnected";
        });

        function showMessage(text) {
            complaintList.innerHTML = `<div class="no-data">${esc(text)}</div>`;
        }

        // --- CARD ---
        function renderComplaintCard(data) {
            let severityClass = 'severity-low';
            if (data.score >= 25 && data.score < 40) {
                severityClass = 'severity-medium';
            } else if (data.score >= 40) {
                severityClass = 'severity-high';
            }

            const complaintId = data.trackingid || data.trackingId;

            const card = document.createElement('div');
            card.className = `complaint-card ${severityClass}`;
            card.id = complaintId;

            const statusIcon = data.status === 'Resolved' ? '🟢'
                : data.status === 'Rejected' ? '🔴'
                : '🟡';

            card.innerHTML = `
        <div class="card-header">
            <span class="card-name">
                ${data.isAnonymous ? '🕵️ Anonymous Student' : '👤 ' + esc(data.name)} <span>${statusIcon}</span>
            </span>
            <span>📅 ${esc(data.date)}</span>
        </div>

        <div class="card-body">
            <p><strong>Tracking ID:</strong> ${esc(complaintId)}</p>
            <p><strong>Category:</strong> ${esc(data.category)}</p>
            <p><strong>Status:</strong> ${esc(data.status || 'Pending')}</p>
            <p class="details">${data.text ? esc(data.text) : '<em>No written details provided.</em>'}</p>
        </div>

        <div class="card-footer">
            <span><strong>Section:</strong> ${esc(data.section || 'N/A')}</span>
            <span class="score-tag">Severity Score: ${data.score}</span>
        </div>
    `;

            complaintList.innerHTML = '';
            complaintList.appendChild(card);
        }

        if (!targetId) {
            showMessage('No tracking ID provided. Use the link or QR code you received after submitting a complaint.');
        }

        // Only ever render the ONE complaint matching this page's tracking ID —
        // this page is a personal status check, not a live feed of everyone's complaints.
        socket.on('complaintHistory', (historyArray) => {
            if (!targetId) return;
            const match = (historyArray || []).find(c => (c.trackingid || c.trackingId) === targetId);
            if (match) {
                renderComplaintCard(match);
            } else {
                showMessage('No complaint found with this tracking ID.');
            }
        });

        // In case the complaint was just submitted and arrives as a live event
        // before complaintHistory even loads.
        socket.on('newComplaint', (data) => {
            if (!targetId) return;
            const id = data.trackingid || data.trackingId;
            if (id === targetId) {
                renderComplaintCard(data);
            }
        });

        socket.on('statusUpdated', ({ trackingId, status }) => {
            if (trackingId !== targetId) return;
            const card = document.getElementById(trackingId);
            if (!card) return;
            const statusText = card.querySelector('.card-body p:nth-of-type(3)');
            if (statusText) statusText.innerHTML = `<strong>Status:</strong> ${esc(status)}`;
        });

        socket.on('cardDeleted', ({ trackingId }) => {
            if (trackingId !== targetId) return;
            showMessage('This complaint record has been removed.');
        });
    </script>
</body>

</html>
