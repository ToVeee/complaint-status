<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint Status</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
        rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <link rel="stylesheet" href="full.css">
</head>

<body>

    <div class="container">
        <header>
            <h1>Complaint Status</h1>
            <div id="status" class="status-badge disconnected">Connecting...</div>
        </header>

        <!-- Entry / lookup view -->
        <div id="lookupView" class="panel">
            <h2>Track Your Complaint</h2>
            <p class="hint">Enter your tracking code, or scan the QR code from your confirmation.</p>

            <form id="codeForm">
                <label for="codeInput" class="visually-hidden">Tracking code</label>
                <input type="text" id="codeInput" placeholder="ER-AB12CD34" autocomplete="off" inputmode="text">
                <button type="submit">Track</button>
            </form>

            <div class="divider"><span>or</span></div>

            <label class="upload-btn" for="qrFileInput">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                    <line x1="14" y1="14" x2="14" y2="21"></line>
                    <line x1="21" y1="14" x2="21" y2="21"></line>
                    <line x1="14" y1="17.5" x2="21" y2="17.5"></line>
                </svg>
                Scan QR Code Photo
            </label>
            <input type="file" id="qrFileInput" accept="image/*" hidden>

            <p id="lookupMessage" class="lookup-message" role="status" aria-live="polite"></p>
        </div>

        <!-- Result view -->
        <div id="resultView" class="panel" style="display:none;">
            <button id="backBtn" class="back-btn">‹ Check another complaint</button>
            <div id="complaintList"></div>
        </div>
    </div>

    <script src="full.js"></script>
</body>

</html>
